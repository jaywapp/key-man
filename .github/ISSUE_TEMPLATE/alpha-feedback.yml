name: 알파 사용 피드백
description: 가짜 데이터로 재현한 오류나 불편한 흐름을 알려주세요.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        실제 키·토큰·개인 보관함·.env·개인 경로를 첨부하지 마세요.
        보안 취약점은 공개 이슈 대신 [보안 정책](https://github.com/jaywapp/key-man/blob/main/SECURITY.md)의 제보 안내를 따라주세요.
  - type: input
    id: version
    attributes:
      label: KeyMan 버전
      placeholder: v1.1.0-alpha.1 또는 소스 커밋
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 버전과 아키텍처
      placeholder: Windows 11, x64
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 사용 경로
      options:
        - GUI
        - CLI
        - MCP
        - 설치·업데이트·제거
        - 문서
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 과정과 기대한 동작
      description: 가짜 값으로 재현한 단계, 기대한 동작과 실제 결과를 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 첨부 내용 확인
      options:
        - label: 실제 키·토큰·개인 보관함·개인 경로를 포함하지 않았습니다.
          required: true
