name: Publish Windows Alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit alpha version (for example 1.1.0-alpha.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: key-man-windows-release
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  KEYMAN_REQUIRE_NATIVE_CLIPBOARD_TESTS: '1'

jobs:
  publish-alpha:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build and run all checks
        run: .\tools\Test-KeyMan.ps1
      - name: Prepare verified portable Inno Setup
        run: .\tools\Get-InnoCompiler.ps1
      - name: Package alpha and SHA-256 checksum
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: .\tools\Build-Installer.ps1 -Version $env:RELEASE_VERSION
      - name: Verify installation and removal on a clean runner
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: .\tools\Test-Installer.ps1 -InstallerPath ".\artifacts\installer\KeyMan-Setup-$env:RELEASE_VERSION.exe" -RegisterEnvironment
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $installer = ".\artifacts\installer\KeyMan-Setup-$env:RELEASE_VERSION.exe"
          $checksum = "$installer.sha256"
          gh release create "v$env:RELEASE_VERSION" $installer $checksum --target $env:GITHUB_SHA --title "KeyMan $env:RELEASE_VERSION" --prerelease --latest=false --notes-file .\docs\alpha-release-notes.md --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publication failed.' }
      - name: Retain a short-lived build copy
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: KeyMan-Windows-Alpha-${{ inputs.version }}
          path: |
            artifacts/installer/KeyMan-Setup-${{ inputs.version }}.exe
            artifacts/installer/KeyMan-Setup-${{ inputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 3
