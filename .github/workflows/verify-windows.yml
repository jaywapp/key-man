name: Verify Windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: key-man-verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  KEYMAN_REQUIRE_NATIVE_CLIPBOARD_TESTS: '1'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build and run all checks
        run: .\tools\Test-KeyMan.ps1
      - name: Prepare verified portable Inno Setup
        run: .\tools\Get-InnoCompiler.ps1
      - name: Package verification build
        run: .\tools\Build-Installer.ps1 -Version 1.1.0-alpha.1
      - name: Verify installation and removal on a clean runner
        run: .\tools\Test-Installer.ps1 -InstallerPath .\artifacts\installer\KeyMan-Setup-1.1.0-alpha.1.exe -RegisterEnvironment
